    const tiles=[];
    for(let r=0;r<ROWS;r++){
      const rw=el('div','wrow');
      const rt=[];
      for(let c=0;c<5;c++){const t=el('div','wt');rw.appendChild(t);rt.push(t);}
      tiles.push(rt);rows.appendChild(rw);
    }
    const KEYS=[['q','w','e','r','t','y','u','i','o','p'],
                ['a','s','d','f','g','h','j','k','l'],
                ['ENTER','z','x','c','v','b','n','m','⌫']];
    const keyEls={};
    KEYS.forEach(kr=>{
      const r=el('div','kr');
      kr.forEach(k=>{
        const b=el('button','k'+(k.length>1?' wide':''),k);
        b.onclick=()=>press(k);
        if(k.length===1)keyEls[k]=b;
        r.appendChild(b);
      });
      kb.appendChild(r);
    });
    function toast(msg){
      const t=el('div','toast',msg);wrap.appendChild(t);
      setTimeout(()=>t.remove(),1300);
    }
    function reset(){
      answer=WORDS[ri(WORDS.length)];guesses=[];curGuess='';done=false;keyState={};
      tiles.forEach(r=>r.forEach(t=>{t.className='wt';t.textContent='';}));
      Object.values(keyEls).forEach(b=>b.className='k');
    }
    function press(k){
      if(done)return;
      if(k==='ENTER')return submit();
      if(k==='⌫'){curGuess=curGuess.slice(0,-1);paint();return;}
      if(curGuess.length<5){curGuess+=k;paint();blip(360,.03);}
    }
    function paint(){
      const r=guesses.length;if(r>=ROWS)return;
      for(let c=0;c<5;c++){
        const t=tiles[r][c];
        t.className='wt'+(curGuess[c]?' fill':'');
        t.textContent=curGuess[c]||'';
      }
    }
    function score(g){
      const res=['b','b','b','b','b'],pool={};
      for(let i=0;i<5;i++)if(g[i]===answer[i])res[i]='g';else pool[answer[i]]=(pool[answer[i]]||0)+1;
      for(let i=0;i<5;i++){
        if(res[i]==='g')continue;
        if(pool[g[i]]){res[i]='y';pool[g[i]]--;}
      }
      return res;
    }
    function submit(){
      if(curGuess.length<5){toast('Not enough letters');return;}
      if(!WORDSET.has(curGuess)){toast('Not in word list');return;}
      const r=guesses.length,res=score(curGuess);
      res.forEach((v,i)=>{
        const t=tiles[r][i];
        setTimeout(()=>{
          t.className='wt fill '+v;
          const k=keyEls[curGuess[i]];
          if(k){
            const rank={b:0,y:1,g:2};
            const cl=k.classList.contains('g')?'g':k.classList.contains('y')?'y':k.classList.contains('b')?'b':null;
            if(cl===null||rank[v]>rank[cl]){k.className='k '+v;}
          }
        },i*130);
      });
      blip(res.filter(x=>x==='g').length*120+300,.09);
      guesses.push(curGuess);
      const gw=curGuess;curGuess='';
      setTimeout(()=>{
        if(gw===answer){
          done=true;
          LS.set('word.win',LS.get('word.win',0)+1);
          LS.set('word.play',LS.get('word.play',0)+1);
          LS.set('word.streak',LS.get('word.streak',0)+1);
          st.set('w',LS.get('word.win',0));st.set('p',LS.get('word.play',0));st.set('s',LS.get('word.streak',0));
          overlay(['Genius!','Magnificent','Impressive','Nice','Great','Phew'][guesses.length-1],
            'The word was '+answer.toUpperCase(),
            [{t:'Next word',p:1,f:()=>startLive()},{t:'Menu',f:home}]);
        } else if(guesses.length>=ROWS){
          done=true;
          LS.set('word.play',LS.get('word.play',0)+1);LS.set('word.streak',0);
          st.set('p',LS.get('word.play',0));st.set('s',0);
          overlay('Out of guesses','The word was '+answer.toUpperCase(),
            [{t:'Next word',p:1,f:()=>startLive()},{t:'Menu',f:home}]);
        }
      },5*130+320);
    }
    const offK=keys(Object.assign(
      Object.fromEntries('abcdefghijklmnopqrstuvwxyz'.split('').map(c=>[c,()=>press(c)])),
      {Enter:()=>press('ENTER'),Backspace:()=>press('⌫')}
    ));
    reset();
    return {stop(){offK();}};
  }
});

/* ==================================================================
   8. Breakout
   ================================================================== */
reg({
  id:'brk',name:'Breakout',emoji:'🧨',color:'#ff9f43',
  desc:'Drag the paddle. Clear every brick.',
  bestLabel(){const b=bestOf('brk');return b?'Best '+b:'';},
  start(root){
    const COLS=8,ROWS=5;
    const PAL=['#ff6b6b','#ff9f43','#f2d13c','#5fd38a','#6fa8ff'];
    let bricks,px,pw,ball,lives,score,level,raf,last,over,stuck;
    const st=statBar([{l:'Score',k:'s',v:0},{l:'Lives',k:'l',v:3},{l:'Level',k:'v',v:1},{l:'Best',k:'b',v:bestOf('brk')||0}]);
    root.appendChild(st.node);
    const c=mkCanvas(root,.72,400);
    root.appendChild(hint('Drag anywhere on the board to move · tap to launch'));

    function newLevel(){
      const {W,H}=c;
      bricks=[];
      const bw=W/COLS,bh=H*.052,top=H*.09;
      for(let r=0;r<ROWS;r++)for(let cc=0;cc<COLS;cc++)
        bricks.push({x:cc*bw,y:top+r*bh,w:bw,h:bh,c:PAL[r%PAL.length],alive:true});
      pw=W*(level>4?.15:.19);px=W/2;
      const sp=Math.min(H*.0085+level*H*.0009,H*.017);
      ball={x:W/2,y:H*.72,vx:sp*(Math.random()<.5?-.6:.6),vy:-sp,r:Math.max(4,W*.017)};
      stuck=true;
    }
    function reset(){
      score=0;lives=3;level=1;over=false;last=0;
      st.set('s',0);st.set('l',3);st.set('v',1);
      newLevel();
    }
    function loseLife(){
      lives--;st.set('l',lives);blip(150,.2,'sawtooth');
      if(lives<=0){
        over=true;
        const nb=best('brk',score);st.set('b',bestOf('brk'));
        overlay('Game over','Score '+score+(nb?' — new best!':''),
          [{t:'Play again',p:1,f:()=>startLive()},{t:'Menu',f:home}]);
        return;
      }
      const {W,H}=c,sp=Math.min(H*.0085+level*H*.0009,H*.017);
      ball.x=W/2;ball.y=H*.72;ball.vx=sp*.6;ball.vy=-sp;stuck=true;
    }
    function tick(dt){
      if(over)return;
      const {W,H}=c;
      if(stuck){ball.x=px;ball.y=H*.9-ball.r-3;return;}
      const steps=Math.max(1,Math.ceil(Math.max(Math.abs(ball.vx),Math.abs(ball.vy))*dt/6));
      for(let s=0;s<steps;s++){
        ball.x+=ball.vx*dt/steps;ball.y+=ball.vy*dt/steps;
        if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1;blip(500,.03);}
        if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1;blip(500,.03);}
        if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;blip(500,.03);}
        const py=H*.9;
        if(ball.vy>0&&ball.y+ball.r>=py&&ball.y-ball.r<py+H*.025&&Math.abs(ball.x-px)<pw/2+ball.r){
          ball.y=py-ball.r;
          const off=(ball.x-px)/(pw/2);
          const sp=Math.hypot(ball.vx,ball.vy);
          const ang=off*1.05;
          ball.vx=sp*Math.sin(ang);ball.vy=-sp*Math.cos(ang);
          blip(680,.04);
        }
        if(ball.y-ball.r>H){loseLife();return;}
        for(const b of bricks){
          if(!b.alive)continue;
          if(ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){
            b.alive=false;score+=10*level;st.set('s',score);blip(620+ri(160),.04);
            const ox=Math.min(ball.x-b.x,b.x+b.w-ball.x),oy=Math.min(ball.y-b.y,b.y+b.h-ball.y);
            if(ox<oy)ball.vx*=-1;else ball.vy*=-1;
            break;
          }
        }
        if(!bricks.some(b=>b.alive)){
          level++;score+=100;st.set('v',level);st.set('s',score);blip(900,.2);
          newLevel();return;
        }
      }
    }
    function draw(){
      const {ctx,W,H}=c;
      ctx.fillStyle='#0e1428';ctx.fillRect(0,0,W,H);
      bricks.forEach(b=>{
        if(!b.alive)return;
        ctx.fillStyle=b.c;ctx.fillRect(b.x+1,b.y+1,b.w-2,b.h-2);
        ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(b.x+1,b.y+1,b.w-2,Math.max(1.5,b.h*.22));
      });
      ctx.fillStyle='#e8ecf5';
      const py=H*.9;
      ctx.beginPath();
      const rr=H*.012;
      if(ctx.roundRect)ctx.roundRect(px-pw/2,py,pw,H*.022,rr);else ctx.rect(px-pw/2,py,pw,H*.022);
      ctx.fill();
      ctx.fillStyle='#ffd166';
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
      if(stuck&&!over){
        ctx.fillStyle='rgba(232,236,245,.65)';ctx.font='600 13px -apple-system,sans-serif';
        ctx.textAlign='center';ctx.fillText('tap to launch',W/2,H*.72);
      }
    }
    function loop(ts){
      raf=requestAnimationFrame(loop);
      if(!last)last=ts;
      let dt=Math.min(ts-last,50);last=ts;
      tick(dt/16.67);draw();
    }
    function movePaddle(clientX){
      const r=c.cv.getBoundingClientRect();
      px=clamp(clientX-r.left,pw/2,c.W-pw/2);
    }
    c.cv.addEventListener('touchstart',e=>{e.preventDefault();movePaddle(e.touches[0].clientX);},{passive:false});
    c.cv.addEventListener('touchmove',e=>{e.preventDefault();movePaddle(e.touches[0].clientX);},{passive:false});
    c.cv.addEventListener('touchend',()=>{if(stuck)stuck=false;});
    c.cv.addEventListener('mousemove',e=>movePaddle(e.clientX));
    c.cv.addEventListener('click',()=>{if(stuck)stuck=false;});
    const offK=keys({ArrowLeft:()=>{px=clamp(px-18,pw/2,c.W-pw/2);},
      ArrowRight:()=>{px=clamp(px+18,pw/2,c.W-pw/2);},' ':()=>{stuck=false;}});
    const offR=onResize(()=>{c.fit();});
    requestAnimationFrame(()=>{c.fit();reset();raf=requestAnimationFrame(loop);});
    return {stop(){cancelAnimationFrame(raf);offK();offR();}};
  }
});

/* ==================================================================
   9. Memory
   ================================================================== */
reg({
  id:'mem',name:'Memory',emoji:'🧠',color:'#b06ef2',
  desc:'Flip and match every pair.',
  bestLabel(){const b=bestOf('mem.16');return b?'Best '+b+' moves':'';},
  start(root){
    const SET='🍎🚀🐙🌵🎸🍕🦊🌙⚡🐳🍄🎲🦋🔥🍋🎧🐝🌊🧊🍩'.match(/./gu);
    let size=LS.get('mem.size',16);
    let cards,first,busy,moves,found,secs,timer,done;
    const st=statBar([{l:'Moves',k:'m',v:0},{l:'Pairs',k:'p',v:'0'},{l:'Time',k:'t',v:'0:00'},{l:'Best',k:'b',v:bestOf('mem.'+size)||'—'}]);
    root.appendChild(st.node);
    const g=el('div','mem');root.appendChild(g);
    const row=el('div','btnrow');
    [[16,'4×4'],[20,'4×5'],[24,'4×6']].forEach(([n,lab])=>{
      const b=el('button','btn sm',lab);
      if(n===size)b.classList.add('primary');
      b.onclick=()=>{size=n;LS.set('mem.size',n);startLive();};
      row.appendChild(b);
    });
    root.appendChild(row);

    const pairs=size/2;
    const pool=shuffle(SET.slice()).slice(0,pairs);
    const deck=shuffle(pool.concat(pool));
    g.style.gridTemplateColumns='repeat(4,1fr)';
    cards=deck.map((sym,i)=>{
      const n=el('div','mc');
      const b=el('div','f fb','?');
      const f=el('div','f ff',sym);
      n.appendChild(b);n.appendChild(f);
      const card={sym,node:n,up:false,gone:false};
      n.onclick=()=>flip(card);
      g.appendChild(n);return card;
    });
    first=null;busy=false;moves=0;found=0;secs=0;done=false;
    st.set('p','0/'+pairs);
    function flip(c){
      if(busy||c.up||c.gone||done)return;
      c.up=true;c.node.classList.add('up');blip(520,.04);
      if(!first){first=c;return;}
      moves++;st.set('m',moves);
      if(first.sym===c.sym){
        first.gone=c.gone=true;found++;
        st.set('p',found+'/'+pairs);blip(760,.09);
        setTimeout(()=>{first&&first.node.classList.add('gone');c.node.classList.add('gone');first=null;},260);
        if(found===pairs){
          done=true;clearInterval(timer);
          const nb=best('mem.'+size,moves,true);st.set('b',bestOf('mem.'+size));
          setTimeout(()=>overlay('All matched! 🎉',moves+' moves in '+fmt(secs)+(nb?' — new best!':''),
            [{t:'Play again',p:1,f:()=>startLive()},{t:'Menu',f:home}]),400);
        }
      } else {
        busy=true;const a=first;first=null;
        setTimeout(()=>{
          a.up=c.up=false;a.node.classList.remove('up');c.node.classList.remove('up');busy=false;
        },720);
      }
    }
    timer=setInterval(()=>{if(!done){secs++;st.set('t',fmt(secs));}},1000);
    return {stop(){clearInterval(timer);}};
  }
});

/* ==================================================================
   10. Connect Four vs the phone
   ================================================================== */
reg({
  id:'c4',name:'Connect 4',emoji:'🔴',color:'#ff6b6b',
  desc:'Beat the on-board opponent.',
  bestLabel(){const w=LS.get('c4.win',0);return w?w+' win'+(w>1?'s':''):'';},
  start(root){
    const W=7,H=6;
    let bd,turn,over,depth=LS.get('c4.depth',4),thinking;
    const st=statBar([{l:'You',k:'w',v:LS.get('c4.win',0)},{l:'Phone',k:'l',v:LS.get('c4.loss',0)},{l:'Draws',k:'d',v:LS.get('c4.draw',0)}]);
    root.appendChild(st.node);
    const drop=el('div','drop');root.appendChild(drop);
    const g=el('div','c4');root.appendChild(g);
    const row=el('div','btnrow');
    [[2,'Easy'],[4,'Normal'],[6,'Hard']].forEach(([d,lab])=>{
      const b=el('button','btn sm',lab);
      if(d===depth)b.classList.add('primary');
      b.onclick=()=>{depth=d;LS.set('c4.depth',d);startLive();};
      row.appendChild(b);
    });
    root.appendChild(row);
    const status=hint('You are red — drop a disc to start');
    root.appendChild(status);

    const holes=[];
    for(let c=0;c<W;c++){const b=el('button',null,'▼');b.onclick=()=>play(c);drop.appendChild(b);}
    for(let r=0;r<H;r++)for(let c=0;c<W;c++){
      const n=el('div','h');n.onclick=()=>play(c);holes.push(n);g.appendChild(n);
    }
    const at=(b,r,c)=>b[r*W+c];
    function reset(){bd=new Array(W*H).fill(0);turn=1;over=false;thinking=false;paint();}
    function paint(win){
      for(let i=0;i<W*H;i++){
        const v=bd[i];
        holes[i].className='h'+(v===1?' r':v===2?' y':'')+(win&&win.includes(i)?' win':'');
      }
    }
    function dropRow(b,c){for(let r=H-1;r>=0;r--)if(!at(b,r,c))return r;return -1;}
    function lineAt(b,p){
      const dirs=[[0,1],[1,0],[1,1],[1,-1]];
      for(let r=0;r<H;r++)for(let c=0;c<W;c++){
        if(at(b,r,c)!==p)continue;
        for(const [dr,dc] of dirs){
          const cells=[r*W+c];
          let ok=true;
          for(let k=1;k<4;k++){
            const nr=r+dr*k,nc=c+dc*k;
            if(nr<0||nc<0||nr>=H||nc>=W||at(b,nr,nc)!==p){ok=false;break;}
            cells.push(nr*W+nc);
          }
          if(ok)return cells;
        }
      }
      return null;
    }
    function full(b){for(let c=0;c<W;c++)if(dropRow(b,c)>=0)return false;return true;}
    function evalWin(win,p){
      let me=0,you=0;
      for(const i of win){if(bd2[i]===p)me++;else if(bd2[i])you++;}
      if(me&&you)return 0;
      if(me)return [0,1,8,60][me];
      if(you)return -[0,1,10,80][you];
      return 0;
    }
    let bd2=null;
    function heur(b,p){
      bd2=b;let s=0;
      const dirs=[[0,1],[1,0],[1,1],[1,-1]];
      for(let r=0;r<H;r++)for(let c=0;c<W;c++)for(const [dr,dc] of dirs){
        const win=[];let ok=true;
        for(let k=0;k<4;k++){
          const nr=r+dr*k,nc=c+dc*k;
          if(nr<0||nc<0||nr>=H||nc>=W){ok=false;break;}
          win.push(nr*W+nc);
        }
        if(ok)s+=evalWin(win,p);
      }
      for(let r=0;r<H;r++){const v=at(b,r,3);if(v===p)s+=3;else if(v)s-=3;}
      return s;
    }
    function nega(b,d,a,be,p){
      if(lineAt(b,3-p))return -100000-d;
      if(full(b)||d===0)return heur(b,p);
      let bestv=-1e9;
      for(const c of [3,2,4,1,5,0,6]){
        const r=dropRow(b,c);if(r<0)continue;
        b[r*W+c]=p;
        const v=-nega(b,d-1,-be,-a,3-p);
        b[r*W+c]=0;
        if(v>bestv)bestv=v;
        if(bestv>a)a=bestv;
        if(a>=be)break;
      }
      return bestv;
    }
    function aiMove(){
      const b=bd.slice();let bestv=-1e9,bestc=3;
      const order=shuffle([3,2,4,1,5,0,6]);
      for(const c of order){
        const r=dropRow(b,c);if(r<0)continue;
        b[r*W+c]=2;
        const v=-nega(b,depth-1,-1e9,1e9,1);
        b[r*W+c]=0;
        if(v>bestv){bestv=v;bestc=c;}
      }
      return bestc;
    }
    function place(c,p){
      const r=dropRow(bd,c);
      if(r<0)return false;
      bd[r*W+c]=p;blip(p===1?420:300,.06);
      const win=lineAt(bd,p);
      paint(win);
      if(win){
        over=true;
        const k=p===1?'win':'loss';
        LS.set('c4.'+k,LS.get('c4.'+k,0)+1);
        st.set(p===1?'w':'l',LS.get('c4.'+k,0));
        overlay(p===1?'You win! 🎉':'Phone wins',p===1?'Nice line.':'Try a different opening.',
          [{t:'Rematch',p:1,f:()=>startLive()},{t:'Menu',f:home}]);
        return true;
      }
      if(full(bd)){
        over=true;LS.set('c4.draw',LS.get('c4.draw',0)+1);st.set('d',LS.get('c4.draw',0));
        overlay('Draw','Board is full.',[{t:'Rematch',p:1,f:()=>startLive()},{t:'Menu',f:home}]);
        return true;
      }
      return false;
    }
    function play(c){
      if(over||thinking||turn!==1)return;
      if(dropRow(bd,c)<0)return;
      if(place(c,1))return;
      turn=2;thinking=true;status.textContent='Thinking…';
      setTimeout(()=>{
        if(over)return;
        place(aiMove(),2);
        turn=1;thinking=false;status.textContent='Your move';
      },60);
    }
    reset();
    return {stop(){over=true;}};
  }
});
